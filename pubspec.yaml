name: life_os
description: Life OS - نظام تشغيل لحياتك الشخصية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.3.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.2.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.4.0"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F0F13"
  image: assets/icon.png
  android_12:
    image: assets/icon.png
    color: "#0F0F13"
